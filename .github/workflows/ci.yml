name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The package has no dependencies, so there is nothing to install.
      - name: Report environment
        run: node --version

      - name: Syntax check every source file
        run: |
          for file in src/*.js lib/*.js bin/*.mjs test/*.mjs install.sh; do
            case "$file" in
              *.js|*.mjs) node --check "$file" ;;
              *.sh) sh -n "$file" ;;
            esac
          done

      - name: Test
        run: npm test
